# Tells Bing (and other IndexNow search engines) about changed pages after each push.
# Runs on GitHub's servers; the key file lives at https://hoptoit.events/<key>.txt
name: IndexNow
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      all:
        description: "Submit every URL in sitemap.xml"
        type: boolean
        default: true
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Wait for GitHub Pages to publish
        run: sleep 120
      - name: Submit URLs
        env:
          ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all }}
          BEFORE: ${{ github.event.before }}
        run: |
          python3 - <<'PY'
          import json, os, re, subprocess, urllib.request
          SITE = "https://hoptoit.events"
          key = re.search(r'INDEXNOW_KEY = "([0-9a-f]+)"', open("_src/build.py").read()).group(1)
          urls = re.findall(r"<loc>(.*?)</loc>", open("sitemap.xml").read())
          if os.environ.get("ALL") != "true":
              before = os.environ.get("BEFORE") or ""
              rng = f"{before}..HEAD" if before and not before.startswith("0000") else "HEAD~1..HEAD"
              try:
                  changed = subprocess.run(["git", "diff", "--name-only", rng], capture_output=True, text=True, check=True).stdout.split()
              except subprocess.CalledProcessError:
                  changed = []
              pages = {SITE + "/" + f[:-len("index.html")] for f in changed if f.endswith("index.html") and not f.startswith("_src")}
              urls = [u for u in urls if u in pages]
          if not urls:
              print("No changed pages to submit."); raise SystemExit
          for i in range(0, len(urls), 10000):
              body = json.dumps({"host": "hoptoit.events", "key": key,
                                 "keyLocation": f"{SITE}/{key}.txt", "urlList": urls[i:i + 10000]}).encode()
              req = urllib.request.Request("https://api.indexnow.org/indexnow", data=body,
                                           headers={"Content-Type": "application/json; charset=utf-8"})
              with urllib.request.urlopen(req) as r:
                  print("Submitted", len(urls[i:i + 10000]), "URLs:", r.status)
          PY
